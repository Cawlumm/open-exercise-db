# Publishes the static catalog snapshot to the `catalog` branch (GitHub Pages
# source). See docs/DEPLOYMENT.md, "Static catalog snapshot".
#
# It reads the PUBLIC HTTP API, not the database, so Actions holds no DB
# credentials or secrets: the only token is the built-in GITHUB_TOKEN, used to
# push the branch.
#
# cmd/build-snapshot refuses to write (job fails, live snapshot untouched) on
# any HTTP error, a count that disagrees with the API's total, zero exercises,
# duplicate ids, a locale whose ids differ from en, or an en catalog under half
# the published size (override: run manually with confirm_removals).
name: Snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      confirm_removals:
        description: 'Publish even if the en catalog shrank to under half of what is published'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REPO_URL: https://github.com/${{ github.repository }}.git
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Check out the catalog branch (or start it)
        env:
          # Step-scoped so the snapshot build never sees it, and only ever handed
          # to git as a per-command extraheader (never written to .git/config).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git_auth() { git -c "http.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          rc=0
          git_auth ls-remote --exit-code --heads "$REPO_URL" catalog >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git_auth clone --branch catalog --single-branch "$REPO_URL" catalog
          elif [ "$rc" -eq 2 ]; then
            echo "catalog branch does not exist yet; starting it"
            git init --initial-branch=catalog catalog
            git -C catalog remote add origin "$REPO_URL"
          else
            echo "git ls-remote failed with exit code $rc; not treating it as an absent branch" >&2
            exit 1
          fi

      # actions/setup-go v5.6.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build snapshot
        working-directory: backend
        env:
          CONFIRM_REMOVALS: ${{ inputs.confirm_removals }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$CONFIRM_REMOVALS" = "true" ]; then flags+=(-confirm-removals); fi
          go run ./cmd/build-snapshot -out ../catalog "${flags[@]}"

      - name: Commit and push
        working-directory: catalog
        env:
          # Step-scoped so the snapshot build never sees it, and only ever handed
          # to git as a per-command extraheader (never written to .git/config).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "catalog unchanged; nothing to publish"
            exit 0
          fi
          generated_at="$(sed -n 's/.*"generated_at": "\(.*\)".*/\1/p' v1/manifest.json)"
          published_at="$(sed -n 's/.*"published_at": "\(.*\)".*/\1/p' v1/manifest.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot ${generated_at} (published ${published_at})"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin catalog
