name: App credential or rate-limit request
description: Ask for an app credential (bigger budget, and needed to submit data) or a higher limit. Apps are approved by hand.
labels: [rate-limit]
body:
  - type: markdown
    attributes:
      value: |
        See [docs/API_POLICY.md](https://github.com/Cawlumm/open-exercise-db/blob/main/docs/API_POLICY.md).
        Make sure you already send a conformant `User-Agent`, debounce search and mirror the export rather than polling it.
  - type: input
    id: app
    attributes:
      label: App name and URL
    validations:
      required: true
  - type: input
    id: user-agent
    attributes:
      label: User-Agent you send
      description: In the form `AppName/Version (Contact)`.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: What you are building
    validations:
      required: true
  - type: textarea
    id: volume
    attributes:
      label: Expected volume
      description: Requests per minute by endpoint, and how you cache or debounce.
    validations:
      required: true
  - type: dropdown
    id: submits
    attributes:
      label: Will your app submit exercises, edits or translations?
      options:
        - "No, read only"
        - "Yes, and it tells users their contributions are CC0 (public domain)"
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact address for the credential
      description: The credential is sent privately to this address, never posted here. Issues are public, so use an address you are happy to show. Do not post secrets in this issue.
